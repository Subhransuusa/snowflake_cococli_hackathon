name: SV_GEOSPATIAL_DEMAND
description: Geospatial demand analytics for supply chain planning. Covers market
  demand trends with regional signals, part-level demand forecasting, supplier geolocation
  intelligence, and shipping route optimization. Used by planning and executive personas
  to understand demand patterns, geographic supply risks, and trade area coverage.
