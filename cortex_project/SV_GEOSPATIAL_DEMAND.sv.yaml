verified_queries:
  - name: 0;1
    question: Which categories and regions have the highest year-over-year growth
      among those with growing demand trends?
    sql: SELECT mt.REGION, mt.CATEGORY, mt.WEEK_DATE, mt.DEMAND_UNITS, mt.FORECAST_UNITS,
      mt.TREND_SLOPE, mt.YOY_GROWTH_PCT, mt.CONFIDENCE_SCORE, mt.TREND_SIGNAL FROM
      market_trends AS mt WHERE mt.TREND_SIGNAL = 'Growing' ORDER BY mt.YOY_GROWTH_PCT
      DESC LIMIT 20
    verified_at: 1789213254
    verified_by: Semantic Model Generator
  - name: 1;1
    question: What are the top 50 demand forecasts starting from today?
    sql: SELECT df.REGION, df.PART_ID, df.FORECAST_DATE, df.FORECAST_QTY, df.LOWER_BOUND,
      df.UPPER_BOUND, df.CONFIDENCE FROM demand_forecast AS df WHERE df.FORECAST_DATE
      >= CURRENT_DATE ORDER BY df.FORECAST_QTY DESC LIMIT 50
    verified_at: 1789213254
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What are the 20 cheapest shipping routes from suppliers to plants?
    sql: SELECT sr.SUPPLIER_NAME, sr.PLANT_NAME, sr.DISTANCE_KM, sr.TRANSPORT_MODE,
      sr.EST_TRANSIT_DAYS, sr.EST_COST_USD, sr.RISK_LEVEL, sr.TRADE_LANE FROM shipping_routes
      AS sr ORDER BY sr.EST_COST_USD ASC LIMIT 20
    verified_at: 1789213254
    verified_by: Semantic Model Generator
  - name: 3;1
    question: Show me supplier locations with their ratings on a map
    sql: SELECT sg.SUPPLIER_NAME, sg.COUNTRY, sg.LATITUDE, sg.LONGITUDE, sg.NEAREST_HUB_TYPE,
      sg.DISTANCE_TO_HUB_KM, sr_r.OVERALL_RATING, sr_r.RISK_LEVEL FROM supplier_geolocation
      AS sg JOIN supplier_ratings AS sr_r ON sg.SUPPLIER_ID = sr_r.SUPPLIER_ID ORDER
      BY sr_r.OVERALL_RATING DESC
    verified_at: 1789213254
    verified_by: Semantic Model Generator
  - name: 4;1
    question: What is the average demand trend and year-over-year growth by region
      and category?
    sql: SELECT mt.REGION, mt.CATEGORY, ROUND(AVG(mt.TREND_SLOPE), 2) AS avg_trend,
      ROUND(AVG(mt.YOY_GROWTH_PCT), 2) AS avg_yoy_growth, ROUND(AVG(mt.CONFIDENCE_SCORE),
      2) AS avg_confidence FROM market_trends AS mt GROUP BY 1, 2 ORDER BY avg_yoy_growth
      DESC
    verified_at: 1789213254
    verified_by: Semantic Model Generator